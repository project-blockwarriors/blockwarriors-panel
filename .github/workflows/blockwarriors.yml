name: BlockWarriors theme and CLI
on:
  push:
    branches: [blockwarriors-v2]
    paths: ['packages/blockwarriors/**', 'tools/blockwarriors/**', '.github/workflows/blockwarriors.yml']
  pull_request:
    paths: ['packages/blockwarriors/**', 'tools/blockwarriors/**', '.github/workflows/blockwarriors.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run sdk:generate && npm run sdk:testing
      - run: npm ci --prefix packages/blockwarriors
      - run: npm run typecheck --prefix packages/blockwarriors
      - run: npm run test --prefix packages/blockwarriors
      - run: npm run build --prefix packages/blockwarriors
      - run: python3 -m unittest discover -s tools/blockwarriors -v
